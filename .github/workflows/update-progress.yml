name: Update progress

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - progress.json
      - coverage.svg
      - docs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-progress
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so first-solved dates can be read from git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README, coverage grid and portfolio
        run: python scripts/generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md progress.json coverage.svg docs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update progress"
            git pull --rebase origin main
            git push
          fi
